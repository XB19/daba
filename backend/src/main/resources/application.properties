spring.application.name=daba-api
server.port=8080

# PostgreSQL — le mot de passe n'est PAS stocké ici.
# Il est lu depuis la variable d'environnement DB_PASSWORD
# ou depuis config/application.properties (fichier local ignoré par git).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/daba}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Application
app.jwt.secret=${JWT_SECRET:change-me-daba-very-long-secret-key-for-hmac-sha-256-signing-2026}
app.jwt.expiration-hours=24
app.upload-dir=${UPLOAD_DIR:uploads}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.admin.email=${ADMIN_EMAIL:admin@daba.tg}
app.admin.password=${ADMIN_PASSWORD:Admin@2026}
